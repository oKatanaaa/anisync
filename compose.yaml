services:
  anisync:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env before starting AniSync}
      ENCODER: ${ENCODER:-x264}
      MAX_VIEWERS: ${MAX_VIEWERS:-8}
      SUBTITLES: ${SUBTITLES:-bake}
      MAX_HEIGHT: ${MAX_HEIGHT:-1080}
      ALT_HEIGHTS: ${ALT_HEIGHTS:-720}
      CRF: ${CRF:-21}
      X264_PRESET: ${X264_PRESET:-medium}
      MAX_VIDEO_KBPS: ${MAX_VIDEO_KBPS:-3500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-12884901888}
      UPLOAD_REQUEST_TIMEOUT: ${UPLOAD_REQUEST_TIMEOUT:-0}
      START_DELAY_MS: ${START_DELAY_MS:-1200}
      SEEK_DELAY_MS: ${SEEK_DELAY_MS:-700}
    volumes:
      - type: bind
        source: ${MEDIA_DIR:-./media}
        target: /data/media
        bind:
          create_host_path: false
      - type: bind
        source: ${CACHE_DIR:-./cache}
        target: /data/cache
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
